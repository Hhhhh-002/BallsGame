syntax = "proto3";

package ballsgame;

option java_package = "com.h.gameprotocol.proto";
option java_multiple_files = true;

// ============================================================
// 一、客户端 <-> Gateway
// ============================================================

// 客户端发送的统一请求。
// cmd 使用 Java 枚举 GameCommands 中的编号。
message ClientEnvelope {
  uint32 cmd = 1;             // 决定 Gateway Handler 和 body 类型
  uint64 request_id = 2;      // 客户端生成，用于匹配客户端响应
  bytes body = 3;             // 具体请求序列化后的字节
  uint64 client_sequence = 4; // 玩家操作序号，供 Actor 丢弃过期输入
}

// Gateway 发给客户端的响应或主动推送。
// 普通响应沿用客户端 request_id；主动推送使用 request_id = 0。
message ServerEnvelope {
  uint32 cmd = 1;        // 客户端据此解析 body
  uint64 request_id = 2;
  int32 code = 3;        // 0 成功，非 0 失败
  string message = 4;    // 可以展示给客户端的说明
  bytes body = 5;
}

// 客户端 cmd = GameCommands.LOGIN（1001）。
message LoginRequest {
  string account = 1; // 注册时指定的字符串 userId，沿用客户端 account 字段名。
  string password = 2;
}

// 登录成功时放入 ServerEnvelope.body。
// 不向客户端暴露内部 Agent 实例地址和 Actor ID。
message LoginResponse {
  string user_id = 1;
  PlayerPublicInfo player = 2;
}

// 客户端 REGISTER（1002）与 Gateway -> Login 的 REGISTER_ACCOUNT（10018）共用。
// password 仅是受保护传输通道中的输入；存库前必须 BCrypt 哈希，禁止写日志。
message RegisterRequest {
  string account = 1; // 邮箱，同时是用户 ID；大小写规则沿用现有账号表。
  string password = 2;
}

// 注册成功只返回账号 ID，不返回哈希、玩家路由，也不代表已经登录。
message RegisterResponse {
  string user_id = 1;
}

// 客户端 MATCH_HISTORY（1003）：只查自己的记录，不能传另一个用户 ID。
message MatchHistoryRequest {
  uint32 limit = 1; // 0 使用 20；最大 100。
  string cursor = 2; // 首次为空，后续原样使用上次 next_cursor；按记录主键分页。
}
message MatchHistoryResponse {
  repeated MatchHistoryItem records = 1;
  string next_cursor = 2; // 为空表示已到末页；不承诺按时间排序。
}
message MatchHistoryItem {
  string match_id = 1;
  string nickname = 2;
  uint32 rank = 3;
  uint32 player_count = 4;
  int64 start_time = 5; // Unix 毫秒。
  int64 end_time = 6;
  double area = 7;
}
// 服务间 MATCH_HISTORY（10019）：Agent 从自己的 Context 填 user_id，不能信任客户端提供身份。
message SceneMatchHistoryRequest {
  string user_id = 1;
  uint32 limit = 2;
  string cursor = 3;
}

message PlayerPosition {
  string user_id = 1;
  float x = 2;
  float y = 3;
  uint64 ball_id = 4; // 分裂后一个玩家可以有多个球，不能只用 user_id 标识球。
  float radius = 5;
}

// 服务端 -> 客户端，ServerEnvelope.cmd = GameCommands.MOVE（2001）。
message MoveBroadcast {
  uint64 server_tick = 1;
  repeated PlayerPosition players = 2;
}

// 客户端 -> 服务端，ClientEnvelope.cmd = GameCommands.SHIFT（2004）。
// 客户端提供移动意图；实际位置由服务端计算。
message ShiftRequest {
  float direction_x = 1;
  float direction_y = 2;
}

// 客户端 cmd = GameCommands.SPLIT（2002）。
message SplitRequest {
  float direction_x = 1;
  float direction_y = 2;
}

// 客户端 cmd = GameCommands.EJECT（2003）。
message EjectRequest {
  float direction_x = 1;
  float direction_y = 2;
}

// 客户端 cmd = GameCommands.START_GAME（2006）。
message StartGameRequest {
  string nickname = 1; // 本局昵称，与账号及持久化昵称无关；留空使用默认昵称。
}

// 场景创建成功后放入 ServerEnvelope.body；客户端不需要知道内部实例地址。
message StartGameResponse {
  uint64 scene_id = 1;
}

// 登录时需要返回给客户端的公开玩家信息。
// Agent 内部完整玩家状态不需要全部返回 Gateway。
message PlayerPublicInfo {
  string nickname = 1;
}

// ============================================================
// 二、所有游戏服务共用的服务间外层协议
// ============================================================

// 一个服务间消息只包含请求、响应、事件中的一种。
// Feign HTTP 和内部 Netty 长连接都可以传输其序列化字节。
message ServiceEnvelope {
  oneof payload {
    ServiceRequest request = 1;
    ServiceResponse response = 2;
    ServiceEvent event = 3;
  }
}

// 服务根据 cmd 找自己的 Handler；Handler 再按 cmd 解析 body。
// cmd 使用 Java 枚举 ServiceCommands 中的编号。
message ServiceRequest {
  uint32 cmd = 1;
  uint64 request_id = 2; // 本次服务调用的关联 ID，由发送服务生成
  bytes body = 3;        // 对应业务请求序列化后的字节
}

// cmd 和 request_id 与对应的 ServiceRequest 一致。
message ServiceResponse {
  uint32 cmd = 1;
  uint64 request_id = 2;
  int32 code = 3;        // 0 成功，非 0 失败
  string message = 4;    // 内部处理说明，不应直接原样透传客户端
  bytes body = 5;        // 对应业务结果序列化后的字节
}

// 不对应某次请求的服务间主动事件。（服务主动推送）
message ServiceEvent {
  uint32 cmd = 1; // 使用 ServiceCommands 中的事件编号
  bytes body = 2;
}

// ============================================================
// 三、登录：Gateway -> Login -> AgentMgr -> Agent 实例
// ============================================================

// ServiceCommands.AUTH_LOGIN 的请求 body。
// Gateway 提供登录凭据和自身实例 ID，不选择 Agent 实例。
message GatewayLoginRequest {
  LoginRequest credentials = 1;
  string gateway_instance_id = 2;
  string login_operation_id = 3; // 沿用客户端 LOGIN request_id 的十进制字符串，字段名保留兼容。
  int64 login_deadline_ms = 4; // 本次端到端等待期限（Unix 毫秒），重试不能重新延长期限。
}

// ServiceCommands.BEGIN_LOGIN 的请求 body。
// Login 校验成功后，将确认过的 user_id 交给 AgentMgr。
message BeginLoginRequest {
  string user_id = 1;
  string gateway_instance_id = 2;
  string login_operation_id = 3; // 与 GatewayLoginRequest 相同，AgentMgr 据此返回原结果或继续原操作。
  int64 login_deadline_ms = 4; // 同一端到端期限；过期仅结束等待，AgentMgr 仍负责核实未完成操作。
}

// ServiceCommands.CREATE_PLAYER_AGENT 的请求 body。
// AgentMgr 从 Nacos 发现并选定 Agent 实例后，向该实例发送此请求。
message CreatePlayerAgentRequest {
  string user_id = 1;
  string gateway_instance_id = 2;
  string player_actor_id = 3; // AgentMgr 预先生成；Agent 按此 ID 原子登记创建任务，重试不再创建。
  string login_operation_id = 4; // 本轮登录的业务操作 ID，不能由每次 HTTP 调用重新生成。
}

// ServiceCommands.CREATE_PLAYER_AGENT 成功时的 ServiceResponse.body。
// Agent 实例创建 Actor、加载玩家数据后，返回自己的实例身份供 AgentMgr 核对。
message CreatePlayerAgentResult {
  string player_actor_id = 1;
  PlayerPublicInfo player = 2;
  string agent_host_instance_id = 3;
  string agent_host_service_name = 4;
}

// AgentMgr 记录登录状态和用户路由后，将此结果返回 Login；
// Login 再返回 Gateway。Gateway 保存路由，不参与选实例或创建 Actor。
// user_id 统一使用注册账号字符串；旧 uint64 编码不兼容，所有通信端需要同步重新生成协议。
message LoginBinding {
  string user_id = 1;
  string player_actor_id = 2;
  string agent_host_instance_id = 3;
  string agent_host_service_name = 4;
  PlayerPublicInfo player = 5;
  string login_operation_id = 6; // 调用方核对登录业务结果；仍不向客户端公开内部路由。
}

// ServiceCommands.KICK_OLD_AGENT 的请求 body。
// 旧 Agent 确认 Scene 离场并停止指定 PlayerActor；不停止整个 Agent 服务实例，不保存当局战绩。
message KickOldAgentRequest {
  string user_id = 1;
  string player_actor_id = 2;
}

// KICK_OLD_AGENT 成功结果：确认离场并等待 Actor 真正停止后返回，不得返回“已受理”。
// 枚举名 SAVED_AND_STOPPED 保留兼容：现在保存的是 Redis 原停止响应，不是用户资料或战绩。
// ALREADY_STOPPED 必须有此前完成停止的原响应；查不到内存 Actor 不能直接当作已停止。
message KickOldAgentResult {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    SAVED_AND_STOPPED = 1;
    ALREADY_STOPPED = 2;
  }
  Outcome outcome = 1;
  string user_id = 2;
  string player_actor_id = 3;
}

// ServiceCommands.KICK_OLD_CLIENT 的请求 body。
// 旧 Gateway 按 user_id 找连接，再比对 player_actor_id，防止迟到的踢人请求关闭新登录。
message KickOldClientRequest {
  string user_id = 1;
  string reason = 2;
  string player_actor_id = 3;
}

// KICK_OLD_CLIENT 成功时的 ServiceResponse.body；只表示旧 Gateway 的最终本机处理结果。
message KickOldClientResult {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    CONNECTION_CLOSED = 1; // 旧客户端 Channel 已关闭；不保证客户端应用已展示提示。
    ALREADY_OFFLINE = 2;   // 本机已无该用户的有效连接。
    STALE_IGNORED = 3;     // 当前连接属于另一轮登录，未执行踢人。
  }
  Outcome outcome = 1;
}

// ServiceCommands.PLAYER_DISCONNECTED 的请求 body。
// Gateway 在客户端 Channel 断开后异步发给 AgentMgr；AgentMgr 只处理与当前登录记录匹配的 Actor。
// player_actor_id 必须每次登录都不同；AgentMgr 根据 user_id 查路由，再比对该 Actor ID。
// 相同请求重试时两个字段保持不变，AgentMgr 按这组标识幂等处理。
message PlayerDisconnectedRequest {
  string user_id = 1;
  string player_actor_id = 2;

}

// PLAYER_DISCONNECTED 成功时的 ServiceResponse.body；仅表示最终处理结果，不包含“处理中”。
// ServiceResponse.code = 0 时必须携带此消息；非零时，5xx/5xxx 表示可重试失败，其他错误不可重试。
message PlayerDisconnectedResult {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;//默认值，未指定，非法返回
    SAVED_AND_OFFLINE = 1; // Agent 已保存玩家数据并停止本次 PlayerAgent。
    ALREADY_FINISHED = 2; // 同一断线操作此前已完成，幂等返回。
    STALE_IGNORED = 3;    // 旧连接的通知，不影响新登录。
  }
  Outcome outcome = 1;//返回的结果枚举，标记本次断线处理最终的结果。
}

// ============================================================
// 四、Gateway <-> Agent 实例的双向长连接
// ============================================================

// ServiceCommands.AGENT_LINK_HELLO 的请求 body。
// Gateway 连到登录结果指定的 Agent 实例后发送。
// 这是回程通信握手，不是创建或分配 Actor。
message GatewayAgentLinkHello {
  string gateway_instance_id = 1;
}

// ServiceCommands.FORWARD_PLAYER_COMMAND 的请求 body。
// Agent 实例先用 player_actor_id 找到 Actor，消息进入 Actor 邮箱；
// Actor 再用 client_message.cmd 找移动、分裂等 Handler。
message ForwardPlayerCommand {
  string player_actor_id = 1;
  ClientEnvelope client_message = 2;
}

// ServiceCommands.FORWARD_TO_CLIENT 的事件 body。
// Agent 向对应 Gateway 的长连接发送；Gateway 根据 user_id 找本机 Channel。
// 单人推送填一个 ID，同一 Gateway 上的广播可填多个 ID。
message ForwardToClientEvent {
  repeated string target_user_ids = 1;
  ServerEnvelope client_message = 2;
}

// AGENT_SCENE_LINK_HELLO：Agent 建立到指定 Scene 实例的长连接后发送。 可以用于批量发送同一个agent的的大量用户消息，用作分组号
message AgentSceneLinkHello {
  string agent_host_instance_id = 1;
}

// SCENE_JOIN：请求把玩家加入指定场景。
// 用 ServiceRequest 发送，以 ServiceResponse 确认加入是否成功。
message SceneJoinRequest {
  uint64 scene_id = 1;
  string user_id = 2;
  string player_actor_id = 3;
  string nickname = 4;
  string join_operation_id = 5; // 沿用 START_GAME request_id，按 PlayerActor 隔离，并用于屏蔽旧场景消息。
}

// SCENE_LEAVE：请求玩家离开场景。
// 用 ServiceRequest 发送，以 ServiceResponse 确认离开结果。
message SceneLeaveRequest {
  uint64 scene_id = 1;
  string user_id = 2;
  string player_actor_id = 3;
  string join_operation_id = 4;
}

// SCENE_PLAYER_INPUT：高频战斗输入，可用单向 ServiceEvent 发送。
// Scene 实例先按 scene_id 找 SceneActor，SceneActor 再按
// client_message.cmd 解析 ShiftRequest、SplitRequest 等并处理。
message ScenePlayerInput {
  uint64 scene_id = 1;
  string user_id = 2;
  string player_actor_id = 3;
  ClientEnvelope client_message = 4;
  string join_operation_id = 5;
}

// SCENE_TO_AGENT：Scene 通过同一条双向长连接发回 Agent。
// 单人结果填一个目标；广播到该 Agent 实例上的多个玩家时填多个。
// Agent 再将需要给客户端的内容转发给对应 Gateway。
message SceneToAgentEvent {
  uint64 scene_id = 1;
  repeated string target_user_ids = 2;
  ServerEnvelope client_message = 3;
  repeated string target_player_actor_ids = 4; // 与 user_ids 一一对应，拒绝上一轮登录的迟到广播。
  repeated string target_join_operation_ids = 5;
}

// CREATE_SCENE：Agent 选定 Scene 实例后，请它为一局新游戏创建 SceneActor。
message CreateSceneRequest {
  string user_id = 1;
  string player_actor_id = 2;
  string operation_id = 3; // 沿用 START_GAME request_id，同 PlayerActor 的重试复用。
}

// 在选定 Scene 实例内查找可加入的比赛；没有时创建，返回路由后再 SCENE_JOIN。
message FindSceneRequest {
  string operation_id = 1; // START_GAME request_id 的十进制字符串。
  string player_actor_id = 2; // 容器所属玩家会话；不同玩家可以使用同一个 request_id。
}
message SceneJoinResult { uint64 scene_id = 1; }
message SceneLeaveResult {
  enum Outcome { OUTCOME_UNSPECIFIED = 0; LEFT = 1; ALREADY_LEFT = 2; }
  Outcome outcome = 1;
}
message BallState {
  uint64 ball_id = 1;
  string user_id = 2;
  float x = 3;
  float y = 4;
  float radius = 5;
  string nickname = 6;
}
message FoodState { uint64 food_id = 1; float x = 2; float y = 3; }
// 入场完整快照；后续按 Tick 推送位置及增删事件。
message SceneSnapshot {
  uint64 scene_id = 1;
  uint64 server_tick = 2;
  repeated BallState balls = 3;
  repeated FoodState foods = 4;
  float width = 5;
  float height = 6;
  uint32 tick_rate = 7;
  bool started = 8; // false 表示等候室，不推进战斗或计时；达到最低人数后变为 true。
  uint32 min_players_to_start = 9;
  uint32 player_count = 10; // 当前在场成员数，包含没有球的观战玩家。
}
message PlayerEnteredEvent { repeated BallState balls = 1; }
message FoodAddedEvent { repeated FoodState foods = 1; }
message FoodEatenEvent { uint64 ball_id = 1; uint64 food_id = 2; float radius = 3; }
message PlayerLeftEvent { string user_id = 1; repeated uint64 ball_ids = 2; }
message BallChangedEvent { repeated BallState upserts = 1; repeated uint64 removed_ball_ids = 2; }
// 每局排名由 Scene 权威计算；账号 ID 相同的所有球面积相加。并列分数使用并列名次。
message MatchRankingEntry {
  string user_id = 1;
  string nickname = 2;
  double area = 3;
  uint32 rank = 4;
  bool left = 5; // 提前离场记 0 分，保留参赛者，不能靠离场保住高分。
}
message MatchRanking {
  uint64 scene_id = 1;
  string scene_instance_id = 2;
  uint64 server_tick = 3;
  repeated MatchRankingEntry players = 4;
  bool frozen = 5;
  int64 started_at_ms = 6;
  int64 ends_at_ms = 7;
  enum EndReason { NONE = 0; TIME_LIMIT = 1; ALL_LEFT = 2; }
  EndReason end_reason = 8;
  int64 ended_at_ms = 9; // 最终榜实际结束时间；全员离场提前结束时与原定 ends_at_ms 不同。
}

// CREATE_SCENE 成功时的 ServiceResponse.body。
// Agent 必须保存 scene_id 与承载该场景的服务实例，后续输入固定路由。
message CreateSceneResult {
  uint64 scene_id = 1;
  string scene_host_service_name = 2;
  string scene_host_instance_id = 3;
}
